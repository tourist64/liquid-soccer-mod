name: Publicar jogo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Godot 3.5.3
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.5.3-stable_linux_headless.64

      - name: Compilar remaster a partir da fonte
        run: |
          /tmp/godot/Godot_v3.5.3-stable_linux_headless.64 --path source/advanced --export-pack "Linux/X11" /tmp/remaster-source.pck
          python3 tools/build_remaster.py --base game3/index-mod.pck --source /tmp/remaster-source.pck --output game3/index.pck
          pck_size=$(stat -c %s game3/index.pck)
          sed -i -E "s/(\"index\.pck\":)[0-9]+/\1${pck_size}/" game3/index.html
          # Cache-bust: browsers otherwise keep an old index.pck for up to 10 minutes.
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"index.pck?v=${GITHUB_SHA}\"/" game3/index.html
          rm -f game3/index-mod.html game3/index-mod.pck

      - name: Montar artefato web
        uses: actions/upload-pages-artifact@v3
        with:
          path: game3

      # deploy-pages looks the artifact up straight away and sometimes misses it; wait until it's listed.
      - name: Aguardar artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -qx github-pages; then
              echo "Artifact listed after $((i * 2 - 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Artifact still not listed after 60s; trying to publish anyway"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
