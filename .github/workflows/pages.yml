name: Publicar jogo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Godot 3.5.3
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.5.3-stable_linux_headless.64

      - name: Compilar remaster a partir da fonte
        run: |
          /tmp/godot/Godot_v3.5.3-stable_linux_headless.64 --path source/advanced --export-pack "Linux/X11" game3/index.pck
          pck_size=$(stat -c %s game3/index.pck)
          sed -i -E "s/(\\\"fileSizes\\\":\\\{\\\"index\\.pck\\\":)[0-9]+/\\1${pck_size}/" game3/index.html
          rm -f game3/index-mod.html game3/index-mod.pck

      - name: Montar artefato web
        uses: actions/upload-pages-artifact@v3
        with:
          path: game3

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
